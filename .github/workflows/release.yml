name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    if: github.repository == 'alitycs/alitycs-sdk-js'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag targets reviewed main history
        shell: bash
        run: |
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "error: releases require an annotated tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "error: release tag must target a commit reachable from main" >&2
            exit 1
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release version
        run: bun run scripts/check-release-version.ts
      - name: Run release checks
        run: bun run check
      - name: Pack release archives
        run: |
          mkdir -p release
          for package in core browser browser-snippet; do
            (cd "sdks/$package" && bun pm pack --destination "$GITHUB_WORKSPACE/release")
          done
          (cd release && sha256sum *.tgz > SHA256SUMS)
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
