name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    if: github.repository == 'alitycs/alitycs-sdk-js'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release version
        run: bun run scripts/check-release-version.ts
      - name: Run release checks
        run: bun run check
      - name: Pack release archives
        run: |
          mkdir -p release
          for package in core browser browser-snippet; do
            (cd "sdks/$package" && bun pm pack --destination "$GITHUB_WORKSPACE/release")
          done
          (cd release && sha256sum *.tgz > SHA256SUMS)
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
