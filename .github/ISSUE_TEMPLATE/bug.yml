name: Bug report
description: Report reproducible SDK behavior that differs from the documented contract.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, customer data, or security vulnerabilities.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@alitycs/core"
        - "@alitycs/browser"
        - "@alitycs/browser-snippet"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Bun 1.4.0, Node 24, Chrome 140, etc.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include steps or a small repository with all credentials removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
